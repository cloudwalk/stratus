version: "2"
services:
  # ----------------------------------------------------------------------------
  # Prometheus
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    volumes:
      - ./static/prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - 9090:9090
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--log.level=debug"

  # ----------------------------------------------------------------------------
  # OpenTelemetry
  # ----------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.57@sha256:8f165334f418ca53691ce358c19b4244226ed35c5d18408c5acf305af2065fb9
    ports:
      - 4317:4317
      - 16686:16686

  # ----------------------------------------------------------------------------
  # Kafka
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.4.1@sha256:d3acff0466ec26c8048b75c7185dbc9c9d718cb1111f0cc00d535df073d71103
    hostname: kafka
    container_name: kafka
    ports:
    - 29092:29092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  # ----------------------------------------------------------------------------
  # Grafana Stack
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:12.0.2@sha256:b5b59bfc7561634c2d7b136c4543d702ebcc94a3da477f21ff26f89ffd4214fa
    ports:
      - 3005:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./static/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks:
      - grafana-stack

  loki:
    image: grafana/loki:3.4.4@sha256:60d1149816084144eb92e4df1e2e5ee1f5eeea0310c0c7795b87c296bd9c939f
    ports:
      - 3100:3100
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - grafana-stack

  promtail:
    image: grafana/promtail:3.6.11@sha256:a761cb834cfaeee29745440d4884d6748f0a08d8f68928db1d707018c1dcfbe9
    volumes:
      - ./static/promtail/config.yaml:/etc/promtail/config.yaml
      - .:/var/log/host  # Mount host logs to a specific directory
    command: -config.file=/etc/promtail/config.yaml -log.level=debug
    depends_on:
      - loki
    networks:
      - grafana-stack

volumes:
  postgres-data:
  loki-data:
  grafana-data:
  alloy-data:

networks:
  grafana-stack:
    driver: bridge

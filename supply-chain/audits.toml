[[audits.const-hex]]
who = "Daniel Freire <daniel.freire@cloudwalk.io> (audited by pi with glm-5.2)"
criteria = "safe-to-deploy"
delta = "1.17.0 -> 1.19.0"
notes = """
Reviewed 1.17.0 -> 1.19.0 diff via cargo vet diff --mode local.

Scope: SIMD decode optimization, serde refactor, uppercase prefix support.

Unsafe / Soundness:
- All new unsafe blocks are confined to SIMD intrinsics (AVX2, SSE2, NEON, wasm32 SIMD, portable-simd) behind runtime CPU feature detection (has_avx2, has_sse2, has_neon, etc.).
- New single-pass SIMD decode uses Muła & Langdale's Algorithm #3, a well-known and published approach for validating hex during SIMD decode. Invalid bytes produce nibble values > 15, detected via saturating-add MSB check. The logic is mathematically sound and documented inline with citations.
- generic::decode_maybe_check simplified: removed macro, direct get_unchecked calls with preconditions unchanged (output.len() == input.len() / 2).
- No new ambient capabilities or FFI.

Network / File I/O / Process:
- None introduced. const-hex remains a pure computational library.

Dependencies:
- hex-simd 0.8 added only as dev-dependency (benchmarks/tests); does not affect production builds.

Behavioral changes:
- strip_prefix now accepts both 0x and 0X prefixes (minor additive feature).
- serde serialize functions now use serializer.collect_str + format_args! instead of serialize_str with intermediate String; this removes the alloc feature gate requirement and is a pure optimization.
- Added no_prefix serde submodule for serialization without 0x prefix.
- All existing public APIs behaviorally unchanged.
"""


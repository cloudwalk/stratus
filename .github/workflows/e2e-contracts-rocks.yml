name: Contracts E2E Rocks tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/docs-release.yml"
      - ".github/workflows/outdated.yml"
      - ".github/workflows/comment-tag-report.yml"
      - ".github/workflows/pr-agent.yml"
      - ".github/workflows/build-binary.yml"
      - ".github/CODEOWNERS"
      - "config/**"
      - "README.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "utils/slack-notifiers/**"
  workflow_dispatch:
  push: # Rebuild cache policy
    branches:
      - "main"
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"

env:
  CACHE_SHARED_KEY: stable-release
  # Use the `ci` profile (deps stripped of debug symbols; stratus keeps full debug).
  # See [profile.ci] in Cargo.toml and profile_flag in the justfile.
  STRATUS_PROFILE: ci
  CACHE_PATH: |
    ~/.cargo/registry/index/
    ~/.cargo/registry/cache/
    ~/.cargo/git/db/
    target/

jobs:
  get_contracts_matrix:
    name: Get Contracts Matrix
    runs-on: stratus-runner
    timeout-minutes: 5

    outputs:
      contracts: ${{ steps.contracts.outputs.contracts }}

    steps:
      - name: Checkout brlc-monorepo repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: cloudwalk/brlc-monorepo
          token: ${{ secrets.BRLC_MONOREPO_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Collect contracts matrix
        id: contracts
        run: |
          contracts=$(corepack pnpm run -s get-e2e-contracts)
          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"

  contract_test_rocks:
    strategy:
      fail-fast: false
      matrix:
        contract: ${{ fromJson(needs.get_contracts_matrix.outputs.contracts) }}
    name: E2E Rocks on ${{ matrix.contract }}
    needs:
      - get_contracts_matrix
    runs-on: stratus-runner
    timeout-minutes: 45

    concurrency:
      group: ${{ github.workflow }}-${{ matrix.contract }}-${{ github.ref || github.run_id }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install libsasl2-dev libssl-dev
        run: sudo apt-get update && sudo apt install -y build-essential pkg-config libssl-dev libsasl2-dev

      - name: Install LLVM 22
        uses: ./.github/actions/install-llvm-22

      - name: Set up Rust
        run: rustup show

      - name: Rust Cache - Restore shared key
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CACHE_PATH }}
          restore-keys: ${{ env.CACHE_SHARED_KEY }}
          key: ${{ env.CACHE_SHARED_KEY }}

      - name: Install cargo tools
        run: cargo install killport@1.1.0 wait-service@0.3.1 || true

      - name: Set up dependencies
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # v2
        with:
          tool: cargo-llvm-cov@0.6.14

      - name: Set up Just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions

      - name: Clone BRLC Monorepo repository
        run: just contracts-clone
        env:
          BRLC_MONOREPO_TOKEN: ${{ secrets.BRLC_MONOREPO_TOKEN }}

      - name: Run e2e tests
        run: just run-test contracts-test-stratus ${{ matrix.contract }}
        env:
          CARGO_PROFILE_RELEASE_DEBUG: 0
          RUST_LOG: error
          RELEASE: 1
          RUST_BACKTRACE: 1
          MANIFEST_DEFAULT_DIR: /tmp/oz

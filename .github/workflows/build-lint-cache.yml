name: Build Lint Cache

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tests/fixtures/**"
      - "static/**"
      - ".sqlx/**"

env:
  CACHE_LINT_KEY: lint-nightly-2026-05-08  # gitleaks:allow - cache key, not a secret
  CACHE_PATH: |
    ~/.cargo/registry/index/
    ~/.cargo/registry/cache/
    ~/.cargo/git/db/
    target/

jobs:
  build_lint_cache:
    name: Build Lint cache
    runs-on: stratus-runner
    timeout-minutes: 45

    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Rust Nightly
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly-2026-05-08
          components: clippy

      - name: Rust Cache - Restore lint cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ env.CACHE_LINT_KEY }}-${{ runner.os }}--${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ env.CACHE_LINT_KEY }}-${{ runner.os }}--

      - name: Install libsasl2-dev libssl-dev
        run: sudo apt-get update && sudo apt install -y build-essential pkg-config libssl-dev libsasl2-dev

      - name: Prime lint cache
        # Mirrors the clippy invocation in `just lint-check` (justfile_helpers: _lint) so the
        # fingerprints produced here are reused by the PR lint job that restores this cache.
        run: cargo +nightly-2026-05-08 clippy --all-targets -- -D warnings -A clippy::unwrap_used -A clippy::expect_used -A clippy::panic

      - name: Rust Cache - Save lint cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ env.CACHE_LINT_KEY }}-${{ runner.os }}--${{ hashFiles('**/Cargo.lock') }}

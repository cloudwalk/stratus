name: E2E Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/docs-release.yml"
      - ".github/workflows/outdated.yml"
      - ".github/workflows/comment-tag-report.yml"
      - ".github/workflows/pr-agent.yml"
      - ".github/workflows/build-binary.yml"
      - ".github/CODEOWNERS"
      - "config/**"
      - "README.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "utils/slack-notifiers/**"
  workflow_dispatch:
  push: # Rebuild cache policy
    branches:
      - "main"
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"

jobs:
  e2e-automine-stratus-rocks:
    name: E2E Automine Stratus Rocks
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-automine-rocks-${{ github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/run-internal-ci
        with:
          internal-workflow: e2e-test.yml
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          pr: ${{ github.event.pull_request.number || '' }}
          ci-key: e2e-automine-rocks
          dispatch-inputs: '{"variant":"automine-rocks"}'
          timeout-minutes: 40
          token: ${{ secrets.INTERNAL_BUILDS_TOKEN }}

  e2e-external-stratus-rocks:

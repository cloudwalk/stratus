name: E2E Leader & Fake Leader

permissions:
  contents: read

on:
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/docs-release.yml"
      - ".github/workflows/outdated.yml"
      - ".github/workflows/comment-tag-report.yml"
      - ".github/workflows/pr-agent.yml"
      - ".github/workflows/build-binary.yml"
      - ".github/CODEOWNERS"
      - "config/**"
      - "README.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "utils/slack-notifiers/**"
  push: # Rebuild cache policy
    branches:
      - "main"
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:

env:
  CACHE_SHARED_KEY: stable-release
  STRATUS_PROFILE: ci
  CACHE_PATH: |
    ~/.cargo/registry/index/
    ~/.cargo/registry/cache/
    ~/.cargo/git/db/
    target/

jobs:
  leader_fake_leader_test:
    name: "E2E Leader & Fake Leader on fake-leader"
    runs-on: ubuntu-22.04
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 130

    concurrency:
      group: ${{ github.workflow }}-fake-leader-${{ github.ref || github.run_id }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run internal E2E shard
        uses: ./.github/actions/run-internal-ci
        with:
          internal-workflow: e2e-leader-fake-leader.yml
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          pr: ${{ github.event.pull_request.number || '' }}
          ci-key: leader-fake-leader
          timeout-minutes: 125
          token: ${{ secrets.INTERNAL_BUILDS_TOKEN }}

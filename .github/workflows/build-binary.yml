name: Build Binary

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      features:
        description: "List of features to enable"
        required: false
        default: ""
      commit_sha:
        description: "Specific commit SHA to checkout and build. If empty, builds HEAD of the branch."
        required: false
        default: ""
  push:
    branches:
      - "main"
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tests/fixtures/**"
      - "static/**"
      - ".sqlx/**"

env:
  RETENTION_DAYS: 90
  BUILDS_REPO: cloudwalk/stratus-internal-builds
  BUILDS_REF: main
  BUILDS_WORKFLOW: build-binary.yml

jobs:
  proxy_build:
    name: Dispatch internal build and mirror artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    concurrency:
      group: ${{ github.workflow }}-${{ github.event.inputs.commit_sha || github.sha }}-${{ github.event.inputs.features || 'default' }}
      cancel-in-progress: true

    env:
      GH_TOKEN: ${{ secrets.INTERNAL_BUILDS_TOKEN }}

    steps:
      - name: Checkout Stratus
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          # Full history so the ref validation below can verify the commit is
          # reachable from a branch or tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate build ref
        id: resolve-sha
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Only commits reachable
          # from a branch or tag of cloudwalk/stratus may be built. Fork
          # pull-request refs (refs/pull/* and their commit SHAs) are rejected
          # here, before any internal run is dispatched.
          if [ -z "$(git branch -r --contains HEAD)" ] && [ -z "$(git tag --contains HEAD)" ]; then
            echo "::error::Ref ${{ inputs.commit_sha || github.sha }} ($sha) is not reachable from any branch or tag of cloudwalk/stratus. Fork pull-request refs (refs/pull/* and their commit SHAs) are not allowed: they would dispatch a build of unreviewed code."
            exit 1
          fi
          echo "Building stratus ref ${{ inputs.commit_sha || github.sha }} ($sha)"

      - name: Dispatch internal build workflow
        run: |
          # Unique per public run attempt. The internal workflow echoes this
          # token in its run name so the polling step below can select exactly
          # the run dispatched here, never an overlapping build of the same
          # commit with different features.
          correlation_id="${{ github.run_id }}-${{ github.run_attempt }}"
          echo "correlation_id=$correlation_id" >> "$GITHUB_ENV"
          jq -n \
            --arg ref "$BUILDS_REF" \
            --arg stratus_ref "${{ steps.resolve-sha.outputs.sha }}" \
            --arg features "${{ inputs.features }}" \
            --arg correlation_id "$correlation_id" \
            '{ref: $ref, inputs: {stratus_ref: $stratus_ref, features: $features, correlation_id: $correlation_id}}' > dispatch.json
          echo "Dispatch payload:"
          cat dispatch.json
          gh api -X POST "repos/$BUILDS_REPO/actions/workflows/$BUILDS_WORKFLOW/dispatches" --input dispatch.json

      - name: Wait for internal build to complete
        id: wait
        run: |
          set -euo pipefail
          # Select the internal run whose name ends with the correlation token
          # sent in the dispatch payload, instead of guessing by creation time:
          # overlapping dispatches (same commit, different features) are
          # indistinguishable by timestamp, and a run created in the same UTC
          # second as the dispatch could even fall outside a time window.
          echo "Waiting for the $BUILDS_WORKFLOW run in $BUILDS_REPO matching correlation token corr=$correlation_id..."
          run_id=""
          for _ in $(seq 1 60); do
            run_id=$(gh run list --repo "$BUILDS_REPO" --workflow "$BUILDS_WORKFLOW" --event workflow_dispatch \
              --limit 50 \
              --json databaseId,displayTitle \
              --jq 'map(select(.displayTitle | endswith("corr='"$correlation_id"'"))) | .[0].databaseId' || true)
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No $BUILDS_WORKFLOW run matching correlation token corr=$correlation_id appeared in $BUILDS_REPO after dispatch" >&2
            exit 1
          fi
          echo "Watching internal build run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$BUILDS_REPO" --exit-status --interval 30

      - name: Download artifacts from internal build
        run: |
          sha="${{ steps.resolve-sha.outputs.sha }}"
          run_id="${{ steps.wait.outputs.run_id }}"
          gh run download "$run_id" --repo "$BUILDS_REPO" --name "stratus-$sha" --dir stratus-artifact
          gh run download "$run_id" --repo "$BUILDS_REPO" --name "checksums-$sha" --dir checksums-artifact

      - name: Upload stratus
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload-str
        with:
          name: stratus-${{ steps.resolve-sha.outputs.sha }}
          path: stratus-artifact/
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

      - name: Upload checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checksums-${{ steps.resolve-sha.outputs.sha }}
          path: checksums-artifact/
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

      - name: Print outputs
        run: |
          echo "Artifact ID: ${{ steps.upload-str.outputs.artifact-id }} (stratus)"
          echo "Artifact URL: ${{ steps.upload-str.outputs.artifact-url }} (stratus)"
          echo "Internal build run: https://github.com/$BUILDS_REPO/actions/runs/${{ steps.wait.outputs.run_id }}"

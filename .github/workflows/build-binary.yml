name: Build Binary

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      features:
        description: "List of features to enable"
        required: false
        default: ""
      commit_sha:
        description: "Specific commit SHA to checkout and build. If empty, builds HEAD of the branch."
        required: false
        default: ""
  push:
    branches:
      - "main"
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tests/fixtures/**"
      - "static/**"
      - ".sqlx/**"

env:
  RETENTION_DAYS: 90
  BUILDS_REPO: cloudwalk/stratus-internal-builds
  BUILDS_REF: main
  BUILDS_WORKFLOW: build-binary.yml

jobs:
  proxy_build:
    name: Dispatch internal build and mirror artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 130

    concurrency:
      group: ${{ github.workflow }}-${{ github.event.inputs.commit_sha || github.sha }}-${{ github.event.inputs.features || 'default' }}
      cancel-in-progress: true

    steps:
      - name: Checkout Stratus
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run internal build
        uses: ./.github/actions/run-internal-ci
        with:
          internal-workflow: build-binary.yml
          ref: ${{ inputs.commit_sha || github.sha }}
          ci-key: build-binary
          dispatch-inputs: ${{ format('{{"features":{0}}}', toJSON(inputs.features)) }}
          mirror-artifacts: all
          artifact-retention-days: ${{ env.RETENTION_DAYS }}
          timeout-minutes: 125
          token: ${{ secrets.INTERNAL_BUILDS_TOKEN }}
